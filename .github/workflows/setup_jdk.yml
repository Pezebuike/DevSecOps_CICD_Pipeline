name: Build

on: 
 workflow_call:

jobs:
  build:
    runs-on: java_build # This job runs on the java_build runner with self hosted runner 
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'adopt'
          cache: maven

      

     

