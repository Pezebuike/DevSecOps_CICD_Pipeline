name: Upload Build Artifact
on:
  workflow_call:
    # inputs:
    # workflow_id:
    #     - "Build"
    # action_id:
    #     - "sonar"
jobs:
  UploadBuildArtifact:
    runs-on: java_build
    # needs: Build # Ensure Sonar runs after Build
    steps:
      - name: Upload Build Artifact
        uses: actions/upload-artifact@v3
        with:
          name: jar
          path: target/*.jar
       
      # - name: Configure JFrog CLI
      # token
      #     run: |
      #         jfrog config add my-artifactory --url=https://trial42aeja.jfrog.io --apikey=${{ secrets.JFROG_TOKEN }}
      - name: Configure JFrog CLI
        uses: jfrog/setup-jfrog-cli@v3
        with:
          version: latest
        env:
          JF_URL: https://trialp9y8bu.jfrog.io
          JF_ACCESS_TOKEN: ${{ secrets.JFROG_TOKEN }}
      - name: Upload JAR to JFrog
        run: |
          sudo jf rt u "target/*.jar" "petjfrog-repo/"