name: CI Pipeline

on:
  push:
    # branches:
    #   - main  
  # pull_request:
  #   branches:
  #     - main

env:
        DOCKER_IMAGE: petapp:${{ github.sha }} # This will be combined with the container registry user name to generate a tag for the image
        # TAG: pezebuike/petapp:${{github.sha}} 
        MAVEN_CLI_OPTS: "DskipTests=true"
        PAT: ${{secrets.GITHUB_TOKEN}}
        USER: pezebuike # docker registry user name 
        REGISTRY: ghcr.io

permissions:
  id-token: write
  contents: read

jobs:
  
  Build:
    uses: ./.github/workflows/javabuild.yml
    secrets: inherit 
    
  owaspdepcheck:
    uses: ./.github/workflows/owaspdepcheck.yml
    needs: Build
    secrets: inherit

  trivy:
    uses: ./.github/workflows/trivy.yml 
    needs: Build
    secrets: inherit

  sonar:
    uses: ./.github/workflows/sonar.yml 
    needs: Build
    secrets: inherit
    
  test:
    uses: ./.github/workflows/test.yml
    needs: sonar
    secrets: inherit

  imagepush:
    uses: ./.github/workflows/imagepush.yml
    needs: test
    secrets: inherit

  # deploy:
  #   uses: ./.github/workflows/deploy.yml
  #   needs: imagepush
  #   secrets: inherit



  
        